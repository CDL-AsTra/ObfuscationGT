[obf]
out = "out"
log = "obf.log"
interactive_mode = false

[containers]
number_of_concurrent_containers = 16
user_mapping = "root"
# user_mapping = "1000:1000"

[checks]
only_enabled = true

[src]
directory = "src"
only_enabled = true

[compiler]
directory = "compiler"
only_enabled = true
timeout = 300
cleanup-failed-containers = true